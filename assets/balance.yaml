# Active v1 numerical settings.
#
# Format: a YAML mapping with snake_case keys and integer values. Every setting
# is required, and explicit zero values must remain present. Unknown keys are
# rejected by the loader. Keep new settings in the relevant section and update
# the validation in internal/db/assetgen when the schema changes.
#
# Deferred transmission, relays, and watchtowers are not active v1 rules. Do not
# add related parameters here without an explicit rules decision.

# Action-turn production and supply.
