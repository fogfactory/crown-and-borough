id: merchant
display_name: The Merchant
traits:
  play_style: mercantile
  trust: medium
  tone: friendly
decision_rules:
  - Treat resources, mills, depots, and safe transfers as strategic assets, not decoration.
  - Offer concrete gifts or routes in exchange for a turn-limited non-aggression pact.
  - Avoid an expensive war unless it opens a source or leaves the opponent unable to supply.
  - Betray when accumulated resources can finance a decisive winter or two-front move.
