name: CI

on:
  push:
    branches: [main]
    # Skip CI on pushes touching no build artifacts (docs, specs, etc.)
    paths-ignore:
      - "specs/**"
      - ".opencode/**"
      - "LICENSE"
      - "*.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    # Run CI only when the PR touches build-relevant files
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - "web/**"
      - ".github/workflows/ci.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crown-and-borough .
