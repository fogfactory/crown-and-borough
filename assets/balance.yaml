# Active v1 numerical settings.
#
# Format: a YAML mapping with snake_case keys and integer values. Every setting
# is required, and explicit zero values must remain present. Unknown keys are
# rejected by the loader. Keep new settings in the relevant section and update
# the validation in internal/db/assetgen when the schema changes.
#
# Deferred transmission, relays, and watchtowers are not active v1 rules. Do not
# add related parameters here without an explicit rules decision.

# Action-turn production and supply.
base_production: 1
supply_range: 3
depot_range_bonus: 2
infra_rations_bonus: 2
cost_base: 2
pillage_bonus: 2
noble_command_bonus: 1
castle_defense_bonus: 1
ration_terrain:
  plain: 1
  forest: 1
  hill: 1
  mountain: 0
  swamp: 0
winter_stock_divisor: 2
village_stock_cap: 1
castle_stock_cap: 2

# Winter investment costs.
costs:
  castle: 10
  mill: 3
  troop: 1
  noble: 2
  supply_depot: 3
  liberation: 0

# P1.7 game setup values.
starting_nobles: 1
starting_troops: 2
starting_resources: 10

special_orders:
  hand_limit: 4
  draw_orders_limit: 2
  deck_size: 30
  calamity_percentage: 30
  calamity_slots:
    spring: 1
    summer: 1
    winter: 1
  calamity_weights:
    plague: 1
    bad_weather: 6
    revolt: 4
    famine: 4
  bonus_weights:
    fair_weather: 1
    abundant_harvest: 1
  effects:
    plague_army_divisor: 2
    plague_noble_mortality_percentage: 50
    revolt_army_count: 3
    revolt_army_min_size: 2
    revolt_army_max_size: 3
    bonus_mill_production: 1
    bonus_army_ration: 1
