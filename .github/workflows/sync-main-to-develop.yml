name: Synchronize Main Into Develop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

env:
  BASE_BRANCH: develop
  SOURCE_BRANCH: main
  SYNC_BRANCH: chore/sync-main-into-develop

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "::error::The RELEASE_PLEASE_TOKEN secret is not configured"
            exit 1
          fi

      - name: Check whether there is content to synchronize
        id: compare
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$SOURCE_BRANCH" \
            --jq '.files | length')"
          if [[ "$changed_files" == "0" ]]; then
            echo "main and develop have no content differences"
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the synchronization branch and pull request
        id: pull_request
        if: steps.compare.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The pull request uses a dedicated branch cut from main (not main
          # itself) so conflicts with develop can be resolved by pushing to it.
          if gh api "repos/$GITHUB_REPOSITORY/branches/$SYNC_BRANCH" >/dev/null 2>&1; then
            # Bring in new main commits; a 409 means a conflict to resolve by hand.
            gh api -X POST "repos/$GITHUB_REPOSITORY/merges" \
              -f base="$SYNC_BRANCH" -f head="$SOURCE_BRANCH" \
              -f commit_message="Merge $SOURCE_BRANCH into $SYNC_BRANCH" >/dev/null \
              || echo "::warning::Conflict updating $SYNC_BRANCH from $SOURCE_BRANCH; resolve it on the branch"
          else
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha')"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$SYNC_BRANCH" -f sha="$main_sha" >/dev/null
          fi

          existing_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -n "$existing_number" ]]; then
            echo "number=$existing_number" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "chore(sync): synchronize main into develop" \
            --body "This automated pull request brings the protected release branch main into develop through the $SYNC_BRANCH branch. It must be merged with a merge commit so future synchronizations remain idempotent. If GitHub reports a conflict, merge develop into $SYNC_BRANCH, resolve it there and push.")"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable automatic merge
        if: steps.compare.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          gh pr merge "${{ steps.pull_request.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --delete-branch=false \
            || echo "::warning::Auto-merge not enabled (likely a conflict to resolve on $SYNC_BRANCH)"
