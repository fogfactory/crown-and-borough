name: Pull Request Policy

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-26.04
    steps:
      # Two rules, nothing else (branch names and labels are free):
      #   1. the title is a Conventional Commit, because release-please reads it;
      #   2. a breaking change targets develop, never main, because main is
      #      deployed to live games.
      - name: Validate title and target branch
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;

            // Promotion (develop -> main) and synchronization (main -> develop)
            // carry already-reviewed history, so there is nothing to check.
            const sameRepo = pr.head.repo?.full_name === pr.base.repo.full_name;
            if (sameRepo && (head === "develop" || head === "main")) return;

            const match = pr.title.match(
              /^(feat|fix|docs|chore|test|refactor|ci|build|perf|revert)(\([^)]+\))?(!)?:\s+\S.+$/,
            );
            const errors = [];

            if (!match) {
              errors.push(
                "The title must use Conventional Commits, for example `fix(api): handle invalid orders`.",
              );
            }

            const breaking = Boolean(match?.[3]) ||
              /BREAKING CHANGE\s*:/i.test(pr.body || "");
            if (breaking && base === "main" && !(sameRepo && head.startsWith("release-please--"))) {
              errors.push(
                "A breaking change must target develop: main is deployed to live games.",
              );
            }

            if (errors.length > 0) core.setFailed(errors.join("\n"));
