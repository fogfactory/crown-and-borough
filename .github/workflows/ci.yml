name: CI

on:
  push:
    branches: [main]
    # Skip CI on pushes touching no build artifacts (docs, specs, etc.)
    paths-ignore:
      - "specs/**"
      - ".opencode/**"
      - "LICENSE"
      - "*.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    # Run CI only when the PR touches build-relevant files
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".dockerignore"
      - "Makefile"
      - "web/**"
      - ".github/workflows/ci.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crown-and-borough .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project crown-and-borough-integration 'make test-firestore'
