name: Synchronize Main Into Develop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

env:
  BASE_BRANCH: develop
  SOURCE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "::error::The RELEASE_PLEASE_TOKEN secret is not configured"
            exit 1
          fi

      - name: Check whether there is content to synchronize
        id: compare
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$SOURCE_BRANCH" \
            --jq '.files | length')"
          if [[ "$changed_files" == "0" ]]; then
            echo "main and develop have no content differences"
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the synchronization pull request
        id: pull_request
        if: steps.compare.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          existing_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -n "$existing_number" ]]; then
            echo "number=$existing_number" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --title "chore(sync): synchronize main into develop" \
            --body "This automated pull request brings the protected release branch main into develop. It must be merged with a merge commit so future synchronizations remain idempotent. Resolve conflicts in this pull request if GitHub cannot merge it automatically.")"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable automatic merge
        if: steps.compare.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          gh pr merge "${{ steps.pull_request.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --delete-branch=false
