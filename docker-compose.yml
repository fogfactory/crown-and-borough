services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8081
      - --project=crown-and-borough-local
      - --rules=/config/firestore.rules
    environment:
      CLOUDSDK_CORE_PROJECT: crown-and-borough-local
    volumes:
      - ./firestore.rules:/config/firestore.rules:ro
    ports:
      - "${FIRESTORE_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          code=$$(curl -s -o /dev/null -w '%{http_code}'
          http://127.0.0.1:8081/);
          test "$$code" != "000"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  auth:
    build:
      context: .
      dockerfile: auth-emulator.Dockerfile
    image: crown-and-borough-auth-emulator:local
    environment:
      CI: "true"
    ports:
      - "${AUTH_PORT:-9099}:9099"
      - "${EMULATOR_UI_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:9099/')
          .then(() => process.exit(0))
          .catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_AUTH_EMULATOR_HOST: ${VITE_FIREBASE_AUTH_EMULATOR_HOST:-}
        VITE_FIREBASE_FIRESTORE_EMULATOR_HOST: ${VITE_FIREBASE_FIRESTORE_EMULATOR_HOST:-}
    image: crown-and-borough:local
    environment:
      ASSETS_DIR: /assets
      FIRESTORE_EMULATOR_HOST: firestore:8081
      FIREBASE_AUTH_EMULATOR_HOST: auth:9099
      FIREBASE_PROJECT_ID: demo-crown-and-borough
      GOOGLE_CLOUD_PROJECT: crown-and-borough-local
      ONLINE_DEV_MODE: ${ONLINE_DEV_MODE:-false}
      PORT: "8080"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
    depends_on:
      firestore:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped
